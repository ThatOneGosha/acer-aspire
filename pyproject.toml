[project]
name = "acer-aspire"
version = "0.1.0"
description = "Infrastructure-as-code ricing for acer aspire one netbook."
requires-python = "==3.14.10"
dependencies = [
    "click==8.5.1",
    "loguru==0.8.0",
    "plumbum==2.0.2",
]

[project.scripts]
acer-aspire = "acer_aspire:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
