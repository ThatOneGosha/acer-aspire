[project]
name = "acer-aspire"
version = "0.1.0"
description = "Ricing for Acer Aspire One"
readme = "README.md"
requires-python = "==3.14.*"
dependencies = [
    "click==8.5.1",
    "plumbum==2.0.2",
]

[project.scripts]
bootstrap = "bootstrap:cli"
converge = "converge:cli"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["bootstrap", "converge"]
